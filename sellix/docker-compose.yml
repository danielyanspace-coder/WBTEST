# ─── SELLIX · локальный/серверный запуск ───
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sellix
      POSTGRES_PASSWORD: sellix
      POSTGRES_DB: sellix
    ports:
      - "5432:5432"
    volumes:
      - sellix_pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sellix_pg:
